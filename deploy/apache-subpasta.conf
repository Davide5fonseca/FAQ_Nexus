# ============================================================
# Base de Procedimentos Técnicos — servida como sub-pasta
#   https://infra.nexus-solutions.pt:9443/procedimentos
# Activado com: a2enconf procedimentos && systemctl reload apache2
# Não altera o vhost da Nexus Ops; aplica-se a todos os vhosts
# (o vhost "bloqueado" continua a negar tudo).
# ============================================================

Alias /procedimentos /var/www/procedimentos/public

<Directory "/var/www/procedimentos/public">
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On
    RewriteBase /procedimentos

    # Cabeçalho Authorization (para o Laravel)
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    # Tudo o que não for ficheiro/pasta real vai para o index.php
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [L]

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
</Directory>

# Nunca expor o .env nem ficheiros escondidos
<Directory "/var/www/procedimentos">
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>
