# ============================================================
# Knowledgebase Nexus — servida como sub-pasta
#   https://infra.nexus-solutions.pt:9443/knowledgebase-nexus
# Activado com: a2enconf procedimentos && systemctl reload apache2
# Não altera o vhost da Nexus Ops; aplica-se a todos os vhosts
# (o vhost "bloqueado" continua a negar tudo).
# ============================================================

Alias /knowledgebase-nexus /var/www/procedimentos/public

# Compatibilidade: o endereço antigo redirecciona para o novo, preservando o
# resto do caminho e os parâmetros (favoritos e links de emails já enviados).
# Temporário de propósito: um redireccionamento permanente fica preso na cache
# do browser e seria difícil de desfazer se o nome voltar a mudar.
Redirect temp /procedimentos https://infra.nexus-solutions.pt:9443/knowledgebase-nexus

<Directory "/var/www/procedimentos/public">
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On
    RewriteBase /knowledgebase-nexus

    # Cabeçalho Authorization (para o Laravel)
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    # Tudo o que não for ficheiro/pasta real vai para o index.php
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [L]

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
</Directory>

# Nunca expor o .env nem ficheiros escondidos
<Directory "/var/www/procedimentos">
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>
