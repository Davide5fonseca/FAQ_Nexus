# Configuração do Nginx para a Knowledgebase Nexus.
# Copiar para /etc/nginx/sites-available/procedimentos e activar com:
#   sudo ln -s /etc/nginx/sites-available/procedimentos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Depois obter o certificado HTTPS com:
#   sudo certbot --nginx -d procedimentos.exemplo.pt
# (o certbot altera este ficheiro automaticamente para HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name procedimentos.exemplo.pt;   # <-- ALTERAR para o vosso domínio

    root /var/www/procedimentos/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10m;

    # Cabeçalhos de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # ajustar se a versão do PHP for outra
        fastcgi_hide_header X-Powered-By;
    }

    # Nunca servir ficheiros escondidos (.env, .git, …)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Ficheiros estáticos com cache
    location ~* \.(css|js|svg|png|jpg|ico)$ {
        expires 7d;
        access_log off;
    }
}
